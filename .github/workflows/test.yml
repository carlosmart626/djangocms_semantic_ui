name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2"]
        cms-version: ["5.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # django-cms 5.1 imports `packaging` at runtime but does not declare
          # it as a dependency, so pin it explicitly.
          pip install "packaging>=23"
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install "django-cms~=${{ matrix.cms-version }}.0"
          pip install -r tests/requirements.txt
          pip install -e .

      - name: Run checks
        run: python -m tests.runtests check

      - name: Run tests
        run: python -m tests.runtests test

      - name: Check for missing migrations
        run: python -m tests.runtests makemigrations --check --dry-run
